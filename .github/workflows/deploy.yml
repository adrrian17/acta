name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

env:
  STAGE: ${{ github.event_name == 'pull_request' && 'preview' || 'prod' }}
  VARLOCK_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
  NODE_ENV: production

jobs:
  deploy:
    # Fork PRs get no OIDC token and no Infisical access, so they never deploy.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Job-level so skipped fork PRs never queue behind or replace a real deploy.
    concurrency:
      group: deploy-${{ github.event_name == 'pull_request' && 'preview' || 'prod' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Diagnose OIDC public claims
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const token = await core.getIDToken('https://github.com/adrrian17');
              core.setSecret(token);
              const { sub, iss, aud, repository, event_name } = JSON.parse(
                Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
              );
              core.info(JSON.stringify({ sub, iss, aud, repository, event_name }));
            } catch {
              core.setFailed('Unable to inspect OIDC public claims safely.');
            }
      # Separate steps so a missing preview variable never falls back to the production identity.
      - name: Load preview secrets from Infisical
        if: github.event_name == 'pull_request'
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PREVIEW_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: preview
          oidc-audience: https://github.com/${{ github.repository_owner }}
          export-type: env
      - name: Load production secrets from Infisical
        if: github.event_name == 'push'
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          oidc-audience: https://github.com/${{ github.repository_owner }}
          export-type: env
      - run: pnpm install --frozen-lockfile --prod=false
      - name: Diagnose Cloudflare API access
        uses: actions/github-script@v7
        with:
          script: |
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
            if (!token || !accountId) {
              core.setFailed('Cloudflare credential configuration is missing.');
              return;
            }
            core.setSecret(token);
            core.setSecret(accountId);
            const probe = async (name, path) => {
              try {
                const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
                  headers: { Authorization: `Bearer ${token}` },
                  signal: AbortSignal.timeout(15000),
                  redirect: 'error',
                });
                const body = await response.json();
                const success = response.ok && body.success === true;
                const errors = Array.isArray(body.errors)
                  ? body.errors.map(error => error.code).filter(Number.isInteger)
                  : [];
                const status = ['active', 'disabled', 'expired'].includes(body.result?.status)
                  ? body.result.status : undefined;
                core.info(JSON.stringify({ probe: name, http: response.status, success, status, errors }));
                return success;
              } catch {
                core.info(JSON.stringify({ probe: name, success: false, error: 'request_failed' }));
                return false;
              }
            };
            const accountPath = `/accounts/${encodeURIComponent(accountId)}`;
            if (!await probe('user_token_verify', '/user/tokens/verify')) {
              await probe('account_token_verify', `${accountPath}/tokens/verify`);
            }
            const workers = await probe('workers_account_access', `${accountPath}/workers/subdomain`);
            const stores = await probe('secrets_store_access', `${accountPath}/secrets_store/stores`);
            if (!workers || !stores) {
              core.setFailed('Cloudflare API access failed. Check the probe statuses and error codes.');
            }
      - name: Deploy
        run: pnpm --filter @acta/infra exec alchemy deploy --stage "$STAGE" --yes
