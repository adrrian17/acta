name: deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: alchemy-${{ github.ref }}
  queue: max

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.15.0
          runtime: node@24
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm --filter web build
      - run: pnpm check
      - run: pnpm test

  reconcile:
    needs: check
    if: github.event_name == 'push' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      ALCHEMY_STAGE: live_adrrian17
      OP_VAULT_ID: ${{ vars.OP_VAULT_ID }}
    steps:
      - id: fresh
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: "heads/main" });
            const current = data.object.sha === context.sha;
            core.setOutput("current", String(current));
            if (!current) core.notice("Event is stale, skipping this run.");
      - if: steps.fresh.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - if: steps.fresh.outputs.current == 'true'
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.15.0
          runtime: node@24
          install: false
          cache: true
          save-cache: false
      - if: steps.fresh.outputs.current == 'true'
        run: pnpm install --frozen-lockfile --prod=false
      - id: fresh_again
        if: steps.fresh.outputs.current == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: "heads/main" });
            const current = data.object.sha === context.sha;
            core.setOutput("current", String(current));
            if (!current) core.notice("Event went stale during setup, skipping mutation.");
      - if: steps.fresh_again.outputs.current == 'true'
        working-directory: packages/infra
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OP_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NODE_ENV: production
          APP_ENV: production
        run: >-
          pnpm exec varlock run --include-internal --inject vars --filter CLOUDFLARE_API_TOKEN,CLOUDFLARE_ACCOUNT_ID -- pnpm exec alchemy provider check-env --provider Cloudflare
      - if: steps.fresh_again.outputs.current == 'true'
        working-directory: packages/infra
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NODE_ENV: production
          APP_ENV: production
          OP_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: pnpm run deploy --yes
